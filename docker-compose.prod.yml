version: '3.8'

services:
  # ===========================================
  # API Gateway - Traefik (Official Docker Image)
  # ===========================================
  traefik:
    image: traefik:v3.0
    container_name: grc-traefik
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--log.level=${TRAEFIK_LOG_LEVEL:-WARN}"
      - "--log.format=json"
      # Access log goes to STDOUT (no --accesslog.filepath), so Docker's
      # json-file driver below owns rotation. A file inside a volume would
      # grow until the disk filled - Docker never rotates a file the
      # application writes itself.
      - "--accesslog=true"
      - "--accesslog.format=json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
      # traefik_logs volume removed: the access log is on stdout now.
    networks:
      - grc-network
      - grc-dmz
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: "json-file"
      # Traefik now carries the access log too, so it gets a bigger ring
      # than the other services: 5 x 20m = 100 MB hard ceiling.
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    # ---------------------------------------------------------------
    # MEMORY BUDGET - host is a single 4 vCPU / 8 GiB VM (Hetzner CPX32
    # or DigitalOcean s-4vcpu-8gb). The memory limits of ALL 12 services
    # must sum to <= 6656 MiB (6.5 GiB), leaving ~1.9 GiB for the host
    # OS, the Docker daemon and page cache. They currently sum to
    # 6208 MiB:
    #   postgres 1536 | controls 768 | minio 768 | frameworks 512
    #   policies 512  | tprm 512     | trust 512 | audit 512
    #   traefik 256   | frontend 96  | gateway 96 | backup-scheduler 128
    # If you raise one limit, lower another. Over-subscribing does not
    # give you more RAM - it just hands the choice of victim to the
    # kernel OOM killer instead of to this file.
    # CPU limits are deliberately left over-subscribed: they are burst
    # ceilings and the scheduler throttles rather than kills.
    # ---------------------------------------------------------------
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ===========================================
  # Database - PostgreSQL (Official Docker Image)
  # ===========================================
  postgres:
    image: postgres:16-alpine
    container_name: grc-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backups:/backups
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - grc-network
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 512M
    shm_size: 256mb

  # ===========================================
  # Object Storage - MinIO (Official MinIO Image)
  # ===========================================
  minio:
    image: minio/minio:latest
    container_name: grc-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Console DISABLED by default. It is an object-store admin UI and has
      # no business on the public internet on a fresh deploy. To reach it
      # deliberately: set MINIO_BROWSER=on in .env.prod, `docker compose -f
      # docker-compose.prod.yml up -d minio`, then from your workstation
      # tunnel to the container's console port 9001 (it is NOT published on
      # the host, and there is no Traefik router for it any more):
      #   ssh -L 9001:$(ssh HOST "docker inspect -f \
      #     '{{.NetworkSettings.Networks.grc-dmz.IPAddress}}' grc-minio"):9001 HOST
      # and open http://localhost:9001. Set it back to off when finished.
      MINIO_BROWSER: ${MINIO_BROWSER:-off}
      MINIO_PROMETHEUS_AUTH_TYPE: public
      MINIO_UPDATE: "off"
      MINIO_DOMAIN: ${MINIO_DOMAIN:-storage.${APP_DOMAIN}}
    volumes:
      - minio_data:/data
    networks:
      - grc-network
      - grc-dmz
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=grc-dmz"
      # API
      - "traefik.http.routers.minio-api.rule=Host(`storage.${APP_DOMAIN}`)"
      - "traefik.http.routers.minio-api.entrypoints=websecure"
      - "traefik.http.routers.minio-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.minio-api.service=minio-api"
      - "traefik.http.services.minio-api.loadbalancer.server.port=9000"
      # No console router: see the MINIO_BROWSER note above. Only the S3 API
      # (port 9000) is published, because the browser fetches evidence from
      # storage.${APP_DOMAIN} via presigned URLs.
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ===========================================
  # Controls Service - Security Controls Management
  # ===========================================
  controls:
    build:
      context: .
      dockerfile: services/controls/Dockerfile
      args:
        NODE_ENV: production
    image: grc-controls:${IMAGE_TAG:-latest}
    container_name: grc-controls
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: false
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # Firebase Authentication (Google provider only). The ID token proves
      # IDENTITY ONLY - role, permissions and organization are read from
      # PostgreSQL on every request, never from token claims.
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS}
      AUTH_AUTO_PROVISION: ${AUTH_AUTO_PROVISION:-false}
      AUTH_DEFAULT_ORG_ID: ${AUTH_DEFAULT_ORG_ID}
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - grc-network
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /app/.npm
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          # Highest of the six: largest service, and it renders PDFs
          # via pdfkit, which spikes well above the steady-state heap.
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M

