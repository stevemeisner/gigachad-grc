  # ===========================================
  # Frontend - React SPA (built by Vite, served by nginx)
  # ===========================================
  # No published ports and no Traefik labels: the gateway is the only way in.
  # The VITE_* values are BUILD ARGS, not runtime env - Vite inlines them into
  # the bundle, so changing one requires a rebuild of this image.
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
    image: grc-frontend:${IMAGE_TAG:-latest}
    container_name: grc-frontend
    environment:
      PORT: 3000
    networks:
      - grc-network
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          # nginx serving static assets from tmpfs - it needs almost nothing.
          memory: 96M
        reservations:
          cpus: '0.1'
          memory: 64M

  # ===========================================
  # Gateway - nginx ingress (SPA + all 53 /api prefixes)
  # ===========================================
  # Single public entrypoint. ./gateway/nginx.conf is the production mirror of
  # the Vite dev proxy table and owns ALL path routing, including the /api
  # strips and renames the per-service Traefik PathPrefix labels could not
  # express. Those labels have been removed from the six API services: the
  # gateway is now the only thing Traefik talks to for ${APP_DOMAIN}.
  gateway:
    image: nginx:alpine
    container_name: grc-gateway
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      controls:
        condition: service_healthy
      frameworks:
        condition: service_healthy
      policies:
        condition: service_healthy
      tprm:
        condition: service_healthy
      trust:
        condition: service_healthy
      audit:
        condition: service_healthy
    networks:
      - grc-network
      - grc-dmz
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=grc-dmz"
      - "traefik.http.routers.gateway.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.gateway.entrypoints=websecure"
      - "traefik.http.routers.gateway.tls.certresolver=letsencrypt"
      - "traefik.http.services.gateway.loadbalancer.server.port=80"
      - "traefik.http.middlewares.gateway-ratelimit.ratelimit.average=200"
      - "traefik.http.middlewares.gateway-ratelimit.ratelimit.burst=100"
      - "traefik.http.routers.gateway.middlewares=gateway-ratelimit"
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          # nginx reverse proxy only, no static content of its own.
          memory: 96M
        reservations:
          cpus: '0.25'
          memory: 64M

  # ===========================================
  # Backup Scheduler - Automated Backups
  # ===========================================
  backup-scheduler:
    build:
      context: ./deploy
      dockerfile: Dockerfile.backup-scheduler
    image: grc-backup-scheduler:${IMAGE_TAG:-latest}
    container_name: grc-backup-scheduler
    environment:
      TZ: ${TZ:-UTC}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      DR_REMOTE_BACKUP_ENABLED: ${DR_REMOTE_BACKUP_ENABLED:-false}
      DR_REMOTE_BACKUP_S3_BUCKET: ${DR_REMOTE_BACKUP_S3_BUCKET:-}
      DR_REMOTE_BACKUP_REGION: ${DR_REMOTE_BACKUP_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SLACK_ENABLED: ${SLACK_ENABLED:-false}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - grc_backups:/backups
      - ./docker-compose.prod.yml:/app/docker-compose.prod.yml:ro
      - ./.env.prod:/app/.env.prod:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - grc-network
    restart: always
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          # Idle between cron ticks; only pg_dump/gzip briefly need memory.
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

networks:
  grc-network:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.20.0.0/16
  grc-dmz:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

volumes:
  postgres_data:
    driver: local
  postgres_backups:
    driver: local
  minio_data:
    driver: local
  traefik_letsencrypt:
    driver: local
  grc_backups:
    driver: local
