# ============================================================================
# GigaChad GRC - production ingress
# ============================================================================
# This is the ONLY public entrypoint for the app. It serves the SPA and fans
# every /api/* prefix out to the owning service.
#
# This file is the production mirror of the Vite dev proxy table in
# frontend/vite.config.ts (server.proxy). Both must be changed together:
# a prefix that exists in one and not the other is a route that works in
# exactly one environment. 53 /api prefixes are reproduced here, in the same
# three classes the dev proxy uses:
#
#   pass-through (34)  the /api prefix is forwarded verbatim; the Nest app
#                      mounts its controllers under /api/... itself.
#                      -> proxy_pass WITHOUT a trailing URI.
#   strip /api   (10)  /api/vendors/9 -> /vendors/9
#                      -> proxy_pass WITH the target path as the URI, which
#                         makes nginx replace the matched location prefix.
#   rename        (9)  /api/vendor-assessments -> /assessments,
#                      /api/audit/<mod>        -> /<mod>
#                      -> same mechanism, different target path.
#
# PRECEDENCE. nginx prefix matching is LONGEST-MATCH-WINS and is independent
# of the order these blocks appear in the file (unlike the dev proxy and
# unlike Traefik PathPrefix rules, where declaration order decides). That
# makes the overlapping prefixes below safe by construction, but each one
# still carries a comment stating why it wins, because the same set of
# prefixes IS order-sensitive everywhere else in this repo.
#
# Service map: controls 3001, frameworks 3002, policies 3004,
#              tprm 3005, trust 3006, audit 3007, frontend 3000.
# ============================================================================

server {
    # Published directly, or sits behind Traefik which terminates TLS.
    listen 80;
    server_name _;

    # Evidence and questionnaire attachments are uploaded through this proxy.
    client_max_body_size 50m;

    # Framework catalog imports, AI answer generation and report exports are
    # slow; the default 60s cuts them off.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Inherited by every location below (nginx only overrides these per level
    # if that level declares its own proxy_set_header).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    # No route here is a websocket, so upstream connections are kept alive
    # rather than upgraded (HTTP/1.1 + empty Connection).
    proxy_set_header Connection "";

    # Liveness for this container only. Exact match, so it can never be
    # shadowed by the SPA fallback.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ------------------------------------------------------------------------
    # Controls service (3001) - pass-through
    # ------------------------------------------------------------------------
    location /api/controls {
        proxy_pass http://controls:3001;
    }

    location /api/evidence {
        proxy_pass http://controls:3001;
    }

    location /api/implementations {
        proxy_pass http://controls:3001;
    }

    location /api/dashboard {
        proxy_pass http://controls:3001;
    }

    # Longer than /api/dashboard, so plural requests are not swallowed by the
    # singular prefix.
    location /api/dashboards {
        proxy_pass http://controls:3001;
    }

    location /api/comments {
        proxy_pass http://controls:3001;
    }

    location /api/tasks {
        proxy_pass http://controls:3001;
    }

    location /api/integrations {
        proxy_pass http://controls:3001;
    }

    location /api/notifications {
        proxy_pass http://controls:3001;
    }

    # Longer than /api/notifications, so it wins for the config sub-API even
    # though both land on the same service.
    location /api/notifications-config {
        proxy_pass http://controls:3001;
    }

    location /api/users {
        proxy_pass http://controls:3001;
    }

    location /api/permissions {
        proxy_pass http://controls:3001;
    }

    location /api/risks {
        proxy_pass http://controls:3001;
    }

    location /api/assets {
        proxy_pass http://controls:3001;
    }

    location /api/risk-config {
        proxy_pass http://controls:3001;
    }

    location /api/risk-scenarios {
        proxy_pass http://controls:3001;
    }

    location /api/seed {
        proxy_pass http://controls:3001;
    }

    location /api/employee-compliance {
        proxy_pass http://controls:3001;
    }

    location /api/training {
        proxy_pass http://controls:3001;
    }

    location /api/ai {
        proxy_pass http://controls:3001;
    }

    location /api/mcp {
        proxy_pass http://controls:3001;
    }

    location /api/system {
        proxy_pass http://controls:3001;
    }

    location /api/bulk {
        proxy_pass http://controls:3001;
    }

    location /api/modules {
        proxy_pass http://controls:3001;
    }

    location /api/config-as-code {
        proxy_pass http://controls:3001;
    }

    # ------------------------------------------------------------------------
    # Controls service (3001) - strip /api
    # ------------------------------------------------------------------------
    # The workspaces controller is mounted at /workspaces, not /api/workspaces.
    location /api/workspaces {
        proxy_pass http://controls:3001/workspaces;
    }

    # ------------------------------------------------------------------------
    # Framework catalog - lives on CONTROLS, not on the frameworks service
    # ------------------------------------------------------------------------
    # PRECEDENCE: /api/frameworks/catalog (22 chars) is longer than
    # /api/frameworks (15 chars), so nginx picks it for
    # /api/frameworks/catalog* and only falls back to the frameworks service
    # for every other /api/frameworks path. This is the one pair where the two
    # candidates resolve to DIFFERENT services, so getting it wrong sends
    # catalog reads to a service that has no catalog module.
    location /api/frameworks/catalog {
        proxy_pass http://controls:3001;
    }

    # ------------------------------------------------------------------------
    # Frameworks service (3002) - pass-through
    # ------------------------------------------------------------------------
    # PRECEDENCE: shorter than /api/frameworks/catalog above, so it is the
    # fallback for that subtree by design.
    location /api/frameworks {
        proxy_pass http://frameworks:3002;
    }

    # Compliance assessments belong to FRAMEWORKS. Vendor assessments are a
    # different resource on tprm and use the /api/vendor-assessments prefix
    # below - the two must not be conflated.
    location /api/assessments {
        proxy_pass http://frameworks:3002;
    }

    location /api/mappings {
        proxy_pass http://frameworks:3002;
    }

    # ------------------------------------------------------------------------
    # Policies service (3004) - pass-through
    # ------------------------------------------------------------------------
    location /api/policies {
        proxy_pass http://policies:3004;
    }

    # ------------------------------------------------------------------------
    # TPRM service (3005) - strip /api
    # ------------------------------------------------------------------------
    location /api/vendors {
        proxy_pass http://tprm:3005/vendors;
    }

    location /api/contracts {
        proxy_pass http://tprm:3005/contracts;
    }

    location /api/tprm-config {
        proxy_pass http://tprm:3005/tprm-config;
    }

    # ------------------------------------------------------------------------
    # TPRM service (3005) - rename
    # ------------------------------------------------------------------------
    # /api/vendor-assessments/... -> /assessments/... on tprm. The public
    # prefix is disambiguated from the frameworks /api/assessments route; the
    # internal path is the plain /assessments controller.
    location /api/vendor-assessments {
        proxy_pass http://tprm:3005/assessments;
    }

    # ------------------------------------------------------------------------
    # Trust service (3006) - strip /api
    # ------------------------------------------------------------------------
    location /api/questionnaires {
        proxy_pass http://trust:3006/questionnaires;
    }

    location /api/knowledge-base {
        proxy_pass http://trust:3006/knowledge-base;
    }

    location /api/trust-center {
        proxy_pass http://trust:3006/trust-center;
    }

    location /api/trust-config {
        proxy_pass http://trust:3006/trust-config;
    }

    location /api/answer-templates {
        proxy_pass http://trust:3006/answer-templates;
    }

    location /api/trust-ai {
        proxy_pass http://trust:3006/trust-ai;
    }

    # ------------------------------------------------------------------------
    # Audit service (3007) - pass-through
    # ------------------------------------------------------------------------
    # PRECEDENCE: /api/audits (11 chars) beats /api/audit (10 chars), so audit
    # engagements reach the audit service and are NOT captured by the controls
    # audit-log route at the bottom of this file.
    location /api/audits {
        proxy_pass http://audit:3007;
    }

    # PRECEDENCE: longer than /api/audit, same reasoning as /api/audits.
    location /api/audit-requests {
        proxy_pass http://audit:3007;
    }

    location /api/findings {
        proxy_pass http://audit:3007;
    }

    # ------------------------------------------------------------------------
    # Audit service (3007) - rename: /api/audit/<module> -> /<module>
    # ------------------------------------------------------------------------
    # PRECEDENCE: every prefix in this block is longer than /api/audit, so all
    # eight win over the controls audit-log route while sharing its stem.
    location /api/audit/templates {
        proxy_pass http://audit:3007/templates;
    }

    location /api/audit/workpapers {
        proxy_pass http://audit:3007/workpapers;
    }

    location /api/audit/test-procedures {
        proxy_pass http://audit:3007/test-procedures;
    }

    location /api/audit/remediation {
        proxy_pass http://audit:3007/remediation;
    }

    location /api/audit/analytics {
        proxy_pass http://audit:3007/analytics;
    }

    location /api/audit/planning {
        proxy_pass http://audit:3007/planning;
    }

    location /api/audit/reports {
        proxy_pass http://audit:3007/reports;
    }

    location /api/audit/audit-ai {
        proxy_pass http://audit:3007/audit-ai;
    }

    # ------------------------------------------------------------------------
    # Audit log / audit trail - lives on CONTROLS (3007 is the audit module)
    # ------------------------------------------------------------------------
    # PRECEDENCE: this is the SHORTEST prefix in the /api/audit* family, so it
    # only ever matches what none of the ten longer prefixes above claim -
    # i.e. /api/audit itself and /api/audit/logs, /api/audit/trail and friends.
    # In the dev proxy this same route has to be declared LAST or it swallows
    # /api/audits, /api/audit-requests and the eight /api/audit/* renames; here
    # longest-match makes its position in the file irrelevant, but it is kept
    # last anyway so the two tables read the same way.
    location /api/audit {
        proxy_pass http://controls:3001;
    }

    # ------------------------------------------------------------------------
    # SPA - everything that is not an /api prefix above
    # ------------------------------------------------------------------------
    # The frontend image is nginx serving the built Vite bundle with its own
    # try_files SPA fallback, listening on the port in its PORT env (3000).
    location / {
        proxy_pass http://frontend:3000;
    }
}
